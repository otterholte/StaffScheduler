{# Shared navigation for the marketing pages. `active` is set by each page via request.path. #}
<nav class="nav">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            <svg class="nav-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Staff Scheduler</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Features</a>
            <a href="/pricing" class="nav-link {% if request.path == '/pricing' %}active{% endif %}">Pricing</a>
            <a href="/support" class="nav-link {% if request.path == '/support' %}active{% endif %}">Support</a>
            <a href="/contact" class="nav-link {% if request.path == '/contact' %}active{% endif %}">Contact</a>
        </div>
        <div class="nav-actions">
            {% if user and user.is_authenticated %}
            <a href="/app" class="btn-primary">Open app</a>
            {% else %}
            <a href="/auth/login" class="nav-link">Sign in</a>
            <a href="/auth/register?promo=FOUNDER50" class="btn-primary">Start free</a>
            {% endif %}
        </div>
    </div>
</nav>
